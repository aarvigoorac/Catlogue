<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Settings - Aarvi Stores</title>

  <style>
    :root {
      --bg-color: #f1f3f6;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0;
      --danger: #d32f2f;
      --danger-bg: #ffebee;
      --input-bg: #f9f9f9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --surface-color: #121212;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --danger-bg: #2c0b0e;
        --input-bg: #1e1e1e;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none !important;
      user-select: none !important;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* --- Page Header with Mobile Back Button --- */
    .page-header {
      position: sticky;
      top: 0;
      background-color: var(--surface-color);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-right: 12px;
      transition: background-color 0.2s;
    }

    .back-btn:active { background-color: var(--bg-color); }
    .back-btn svg { width: 24px; height: 24px; fill: currentColor; pointer-events: none; }
    
    .page-title { font-size: 18px; font-weight: 700; }

    /* --- Main Content --- */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Profile Card --- */
    .profile-card {
      background-color: var(--surface-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }

    .profile-pic-wrapper {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      flex-shrink: 0; 
      background-color: var(--border);
      border: 2px solid var(--primary);
      overflow: hidden;
      position: relative;
    }

    .profile-pic-wrapper img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .profile-info {
      flex: 1;
      min-width: 0; /* CRITICAL: Enables truncation for long text */
    }

    .name-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      word-wrap: break-word;
      word-break: break-word;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .edit-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      flex-shrink: 0;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .edit-btn svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }

    .user-email {
      font-size: 14px;
      color: var(--text-sub);
      word-break: break-all;
    }

    /* --- Settings List --- */
    .settings-group {
      background-color: var(--surface-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }

    .settings-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .settings-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .settings-item:active { background-color: var(--bg-color); }

    .settings-item svg {
      width: 22px; height: 22px; fill: var(--text-sub); margin-right: 16px; pointer-events: none;
    }

    .item-danger { color: var(--danger); }
    .item-danger svg { fill: var(--danger); }

    /* --- Native Bottom Sheet Modal --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-sheet {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      background-color: var(--surface-color);
      border-radius: 20px 20px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    .modal-overlay.active .modal-sheet { transform: translateY(0); }

    @media (min-width: 768px) {
      .modal-sheet {
        width: 400px; bottom: 50%; left: 50%;
        border-radius: 16px; transform: translate(-50%, 150%); padding-bottom: 24px;
      }
      .modal-overlay.active .modal-sheet { transform: translate(-50%, 50%); }
    }

    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .input-group { margin-bottom: 24px; }
    
    .name-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
      -webkit-user-select: text !important;
      user-select: text !important;
      transition: border-color 0.2s;
    }

    .name-input:focus { border-color: var(--primary); }

    .modal-actions { display: flex; gap: 12px; }

    .btn {
      flex: 1; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; border: none; cursor: pointer;
    }

    .btn-cancel { background-color: var(--bg-color); color: var(--text-main); }
    .btn-save { background-color: var(--primary); color: #fff; display: flex; justify-content: center; align-items: center; }
    
    .spinner {
      display: none; width: 18px; height: 18px; border: 2px solid transparent; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="page-header">
    <button class="back-btn" id="back-btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="page-title">Settings</div>
  </header>

  <div class="container">
    
    <div class="profile-card">
      <div class="profile-pic-wrapper">
        <img id="ui-dp" src="" alt="Profile Picture" onerror="this.src='../images/icon.png'">
      </div>
      <div class="profile-info">
        <div class="name-row">
          <div class="user-name" id="ui-name">Loading...</div>
          <button class="edit-btn" id="open-edit-btn">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
        </div>
        <div class="user-email" id="ui-email">...</div>
      </div>
    </div>

    <div class="settings-group">
      <button class="settings-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Account Details
      </button>
      <button class="settings-item">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        Notifications
      </button>
    </div>

    <div class="settings-group">
      <button class="settings-item item-danger" id="logout-btn">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Sign Out
      </button>
    </div>

  </div>

  <!-- Native Bottom Sheet -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-title">Edit Name</div>
      <div class="input-group">
        <input type="text" id="name-input" class="name-input" placeholder="Enter your full name" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cancel-edit-btn">Cancel</button>
        <button class="btn btn-save" id="save-edit-btn">
          <span id="save-text">Save</span>
          <div class="spinner" id="save-spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from '../config.js';
    import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // UI Elements
    const uiDp = document.getElementById('ui-dp');
    const uiName = document.getElementById('ui-name');
    const uiEmail = document.getElementById('ui-email');
    const backBtn = document.getElementById('back-btn');
    const logoutBtn = document.getElementById('logout-btn');
    
    // Modal Elements
    const editModal = document.getElementById('edit-modal');
    const modalSheet = document.getElementById('modal-sheet');
    const openEditBtn = document.getElementById('open-edit-btn');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const saveEditBtn = document.getElementById('save-edit-btn');
    const nameInput = document.getElementById('name-input');
    const saveText = document.getElementById('save-text');
    const saveSpinner = document.getElementById('save-spinner');

    let isModalOpen = false;

    // 1. Load User Data
    onAuthStateChanged(auth, (user) => {
      if (user) {
        uiName.innerText = user.displayName || "Aarvi User";
        uiEmail.innerText = user.email || "No email linked";
        nameInput.value = user.displayName || "";
        
        const localDpUrl = localStorage.getItem('aarvi_dp');
        if (localDpUrl) {
           uiDp.src = localDpUrl;
        } else if (user.photoURL) {
           uiDp.src = user.photoURL;
        }
      } else {
        window.parent.location.reload(); 
      }
    });

    // 2. Hardware/UI Back Button Routing
    backBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      if (document.referrer.includes('login') || window.history.length <= 1) {
        window.location.href = "home.html";
      } else {
        window.history.back();
      }
    });

    // Native Mobile Hardware Back Button Support for the Bottom Sheet
    window.addEventListener('popstate', (e) => {
      if (isModalOpen) {
        // If user pressed the phone's physical back button, just close the modal
        closeModalUI();
      }
    });

    // 3. Modal Logic
    const openModal = () => {
      editModal.classList.add('active');
      isModalOpen = true;
      // Push a fake state to the browser history so the physical back button has something to pop
      history.pushState({ modal: 'edit' }, '', window.location.href);
      setTimeout(() => nameInput.focus(), 300);
    };

    const closeModalUI = () => {
      editModal.classList.remove('active');
      nameInput.blur();
      isModalOpen = false;
    };

    const closeModalAndHistory = () => {
      if (isModalOpen) {
        closeModalUI();
        // If we close via buttons (Cancel/Save), we need to manually pop the history state we pushed
        if (history.state && history.state.modal === 'edit') {
          history.back();
        }
      }
    };

    openEditBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      openModal();
    });

    cancelEditBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(40);
      closeModalAndHistory();
      nameInput.value = auth.currentUser?.displayName || "";
    });

    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) closeModalAndHistory();
    });

    modalSheet.addEventListener('click', (e) => e.stopPropagation());

    // 4. Update Profile
    saveEditBtn.addEventListener('click', async () => {
      const newName = nameInput.value.trim();
      
      if (!newName) {
        alert("Name cannot be empty.");
        return;
      }
      
      if (newName === auth.currentUser.displayName) {
        closeModalAndHistory();
        return;
      }

      if (navigator.vibrate) navigator.vibrate(40);
      
      saveText.style.display = 'none';
      saveSpinner.style.display = 'block';
      saveEditBtn.style.pointerEvents = 'none';

      try {
        await updateProfile(auth.currentUser, { displayName: newName });
        uiName.innerText = newName;
        closeModalAndHistory();
      } catch (error) {
        console.error("Error updating profile:", error);
        alert("Could not update name. Please check your connection.");
      } finally {
        saveText.style.display = 'block';
        saveSpinner.style.display = 'none';
        saveEditBtn.style.pointerEvents = 'auto';
      }
    });

    // 5. Logout
    logoutBtn.addEventListener('click', async () => {
      if (navigator.vibrate) navigator.vibrate(40);
      if (confirm("Are you sure you want to sign out?")) {
        try {
          await signOut(auth);
        } catch (error) {
          alert("Error signing out.");
          console.error(error);
        }
      }
    });
  </script>
</body>
</html>
