<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Catalog Manager</title>

  <style>
    :root {
      --bg-color: #f1f3f6;
      --surface-color: #ffffff;
      --text-main: #000000;
      --text-sub: #666666;
      --border: #e0e0e0;
      --primary: #2874f0;
      --danger: #dc3545;
      --skeleton-base: #e0e0e0;
      --skeleton-shine: #f5f5f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --surface-color: #1a1a1a;
        --text-main: #ffffff;
        --text-sub: #a0a0a0;
        --border: #333333;
        --skeleton-base: #333333;
        --skeleton-shine: #444444;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

    /* Layout & Header */
    .app-container { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; background: var(--bg-color); position: relative; }
    
    .main-header { padding: calc(16px + env(safe-area-inset-top)) 16px 12px; background: var(--surface-color); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; display: flex; flex-direction: column; gap: 12px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .back-nav-btn { display: none; background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 8px 12px 8px 0; margin-right: 8px; align-items: center; justify-content: center; }
    .back-nav-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.5; }
    .page-title { font-size: 22px; font-weight: 800; display: flex; align-items: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Search Bar */
    .search-wrap { position: relative; width: 100%; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 16px; width: 20px; height: 20px; stroke: var(--text-sub); stroke-width: 2.5; transition: stroke 0.3s ease; }
    .search-input { width: 100%; padding: 12px 16px 12px 48px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 15px; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--primary); background: var(--surface-color); }
    .search-input:focus + svg { stroke: var(--primary); }

    /* Scrollable Feeds */
    .feed-container { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; display: flex; flex-direction: column; gap: 16px; }
    .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 600px) { .grid-layout { grid-template-columns: repeat(3, 1fr); } }

    /* Category Cards */
    .cat-card { background: var(--surface-color); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .cat-card:active { transform: scale(0.96); }
    .cat-img-wrap { width: 100%; aspect-ratio: 1; background: var(--bg-color); position: relative; border-bottom: 1px solid var(--border); }
    .cat-img { width: 100%; height: 100%; object-fit: cover; }
    .cat-details { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .cat-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .cat-meta { font-size: 12px; color: var(--text-sub); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-edit-cat { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); border-radius: 50%; padding: 6px; border: none; cursor: pointer; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    @media (prefers-color-scheme: dark) { .btn-edit-cat { background: rgba(0,0,0,0.7); } }

    /* Product Cards */
    .prod-card { background: var(--surface-color); border-radius: 16px; border: 1px solid var(--border); display: flex; gap: 12px; padding: 12px; cursor: pointer; transition: transform 0.15s; }
    .prod-card:active { transform: scale(0.97); }
    .prod-img { width: 80px; height: 80px; border-radius: 12px; background: var(--bg-color); object-fit: contain; flex-shrink: 0; padding: 4px; border: 1px solid var(--border); }
    .prod-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .prod-name { font-size: 15px; font-weight: 800; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .prod-code { font-size: 12px; color: var(--primary); font-weight: 700; }

    /* Floating Action Button */
    .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(40, 116, 240, 0.4); border: none; cursor: pointer; transition: transform 0.2s; z-index: 100; }
    .fab:active { transform: scale(0.9); }
    .fab svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 2.5; }

    /* Shared Overlay & Sheets */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); z-index: 1000; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 100%); width: 100%; max-width: 600px; background: var(--bg-color); border-radius: 24px 24px 0 0; transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); max-height: 90vh; z-index: 1001; }
    .bottom-sheet.active { transform: translate(-50%, 0); }
    
    .sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--surface-color); border-bottom: 1px solid var(--border); border-radius: 24px 24px 0 0; position: sticky; top: 0; z-index: 10; }
    .sheet-title { font-size: 18px; font-weight: 800; }
    .btn-icon { background: transparent; border: none; color: var(--text-main); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; transition: background 0.2s; }
    .btn-icon:active { background: var(--border); }
    .sheet-scroll { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding-bottom: max(40px, env(safe-area-inset-bottom)); }

    /* Form Inputs */
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-label { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-left: 4px; }
    .input-field { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface-color); color: var(--text-main); font-size: 15px; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: var(--primary); }
    textarea.input-field { min-height: 100px; resize: vertical; }

    .btn-save { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; border: none; background: var(--primary); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .btn-save:active { transform: scale(0.97); }

    /* Image Picker UI */
    .image-picker-box { width: 100%; aspect-ratio: 16/9; background: var(--surface-color); border: 2px dashed var(--border); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; color: var(--text-sub); transition: border-color 0.2s; }
    .image-picker-box:active { border-color: var(--primary); }
    .image-picker-box img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; display: none; background: var(--bg-color); }
    .image-picker-box.has-image img { display: block; }

    /* Source Picker Bottom Sheet */
    .source-btn { width: 100%; padding: 18px; display: flex; align-items: center; gap: 16px; background: var(--surface-color); border: 1px solid var(--border); border-radius: 16px; font-size: 16px; font-weight: 700; color: var(--text-main); cursor: pointer; margin-bottom: 12px; }
    .source-btn:active { background: var(--bg-color); }

    /* Full Screen Modals (Product Detail & Camera) */
    .fs-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 2000; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; }
    .fs-modal.active { transform: translateY(0); }
    .fs-header { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: var(--surface-color); border-bottom: 1px solid var(--border); }
    
    /* Product Detail specific */
    .detail-img-wrap { width: 100%; aspect-ratio: 1; background: var(--surface-color); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); cursor: zoom-in; }
    .detail-img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
    .detail-info { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; }
    .detail-title { font-size: 22px; font-weight: 800; color: var(--text-main); }
    .detail-code { font-size: 14px; color: var(--primary); font-weight: 700; background: rgba(40,116,240,0.1); padding: 4px 10px; border-radius: 6px; width: max-content; }
    .detail-desc { font-size: 15px; color: var(--text-sub); line-height: 1.5; white-space: pre-wrap; }
    .action-row { display: flex; gap: 12px; padding: 20px; border-top: 1px solid var(--border); background: var(--surface-color); padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    .btn-outline { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; border: 1.5px solid var(--border); background: transparent; color: var(--text-main); cursor: pointer; text-align: center; }
    .btn-danger { color: var(--danger); border-color: var(--danger); }

    /* Full Screen Image Viewer (Pinch Zoom) */
    .zoom-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; flex-direction: column; }
    .zoom-viewer.active { opacity: 1; pointer-events: auto; }
    .zoom-header { position: absolute; top: 0; left: 0; width: 100%; padding: calc(16px + env(safe-area-inset-top)) 16px; display: flex; justify-content: flex-start; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); }
    .zoom-header .btn-icon { background: rgba(255,255,255,0.2); color: #fff; }
    .zoom-content { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
    .zoom-content img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* In-App Camera UI */
    .camera-viewport { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #camera-video { width: 100%; height: 100%; object-fit: cover; }
    .camera-controls { padding: 24px; padding-bottom: max(32px, env(safe-area-inset-bottom)); background: #000; display: flex; align-items: center; justify-content: center; gap: 40px; }
    .btn-capture { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 4px solid #aaa; cursor: pointer; transition: transform 0.1s; }
    .btn-capture:active { transform: scale(0.9); }
    .cam-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #fff; background: #111; z-index: 10; display: none; }

    /* Utilities */
    .skeleton { background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%) !important; background-size: 200% 100% !important; animation: shimmer 1.5s infinite !important; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .hidden { display: none !important; }
    #hidden-file { display: none; }
  </style>
</head>
<body>

  <!-- Main Dual-State Application -->
  <div class="app-container">
    
    <header class="main-header">
      <div class="header-top">
        <button class="back-nav-btn" id="btn-back-to-cats">
          <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="page-title" id="main-title">Catalogs</div>
      </div>
      <div class="search-wrap">
        <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search catalogs...">
      </div>
    </header>

    <!-- Dynamic Feed Area -->
    <div class="feed-container" id="feed-container">
      <!-- Injected via JS -->
    </div>

    <!-- Smart FAB -->
    <button class="fab" id="main-fab">
      <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
    </button>
  </div>

  <!-- Hidden File Input for Compression Engine -->
  <input type="file" id="hidden-file" accept="image/*" capture="environment">

  <!-- ================= OVERLAYS & MODALS ================= -->
  <div class="modal-overlay" id="main-overlay"></div>

  <!-- 1. Category Form (Bottom Sheet) -->
  <div class="bottom-sheet" id="sheet-category">
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-cat-title">Add Catalog</div>
      <button class="btn-icon btn-close-modal"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </div>
    <div class="sheet-scroll">
      <div class="image-picker-box" id="cat-img-picker">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <div style="font-size:14px; font-weight:600; margin-top:8px;">Add Cover Image</div>
        <img id="cat-img-preview" src="">
      </div>
      <div class="input-group">
        <label class="input-label">Catalog Name</label>
        <input type="text" id="cat-name" class="input-field" placeholder="e.g., Summer Collection">
      </div>
      <div class="input-group">
        <label class="input-label">Short Description</label>
        <input type="text" id="cat-desc" class="input-field" placeholder="Optional brief description">
      </div>
      <button class="btn-save" id="btn-save-cat">Save Catalog</button>
    </div>
  </div>

  <!-- 2. Product Form (Bottom Sheet) -->
  <div class="bottom-sheet" id="sheet-product">
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-prod-title">Add Product</div>
      <button class="btn-icon btn-close-modal"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </div>
    <div class="sheet-scroll">
      <div class="image-picker-box" id="prod-img-picker">
        <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <div style="font-size:14px; font-weight:600; margin-top:8px;">Add Product Image</div>
        <img id="prod-img-preview" src="">
      </div>
      <div class="input-group">
        <label class="input-label">Product Name</label>
        <input type="text" id="prod-name" class="input-field" placeholder="e.g., Premium Silk Saree">
      </div>
      <div class="input-group">
        <label class="input-label">Product Code</label>
        <input type="text" id="prod-code" class="input-field" placeholder="e.g., SKU-1234">
      </div>
      <div class="input-group">
        <label class="input-label">Description</label>
        <textarea id="prod-desc" class="input-field" placeholder="Full product details..."></textarea>
      </div>
      <button class="btn-save" id="btn-save-prod">Save Product</button>
    </div>
  </div>

  <!-- 3. Image Source Picker (Bottom Sheet) -->
  <div class="bottom-sheet" id="sheet-source">
    <div class="sheet-header">
      <div class="sheet-title">Select Image Source</div>
      <button class="btn-icon btn-close-modal"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </div>
    <div class="sheet-scroll" style="padding-top:10px;">
      <button class="source-btn" id="btn-open-camera">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Take Photo
      </button>
      <button class="source-btn" id="btn-open-gallery">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Choose from Gallery
      </button>
    </div>
  </div>

  <!-- 4. Native In-App Camera (Full Screen) -->
  <div class="fs-modal" id="modal-camera">
    <div class="fs-header" style="background:#000; border-bottom:1px solid #333;">
      <button class="btn-icon btn-close-modal" style="color:#fff;"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
      <div class="sheet-title" style="color:#fff;">Camera</div>
      <div style="width:36px;"></div> <!-- Spacer -->
    </div>
    <div class="camera-viewport">
      <video id="camera-video" autoplay playsinline></video>
      <div class="cam-fallback" id="cam-fallback">
        <div style="margin-bottom:16px;">Camera access denied or unavailable.</div>
        <button class="btn-save" style="width:auto; padding:10px 20px;" onclick="document.getElementById('btn-open-gallery').click()">Open Gallery Instead</button>
      </div>
    </div>
    <div class="camera-controls">
      <button class="btn-capture" id="btn-capture-photo"></button>
    </div>
  </div>

  <!-- 5. Product Detail View (Full Screen) -->
  <div class="fs-modal" id="modal-product-detail">
    <div class="fs-header">
      <button class="btn-icon btn-close-modal"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg></button>
      <div class="sheet-title">Product Details</div>
      <div style="width:36px;"></div>
    </div>
    <div class="detail-img-wrap" id="pd-img-wrap">
      <img id="pd-img" class="detail-img" src="">
    </div>
    <div class="detail-info">
      <div class="detail-title" id="pd-name">Loading...</div>
      <div class="detail-code" id="pd-code">...</div>
      <div class="detail-desc" id="pd-desc">...</div>
    </div>
    <div class="action-row">
      <button class="btn-outline btn-danger" id="pd-btn-delete">Delete</button>
      <button class="btn-outline" id="pd-btn-edit">Edit Product</button>
    </div>
  </div>

  <!-- 6. Full Screen Image Zoom (Pitch Black) -->
  <div class="zoom-viewer" id="viewer-zoom">
    <div class="zoom-header">
      <button class="btn-icon btn-close-modal"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </div>
    <div class="zoom-content">
      <img id="zoom-img" src="">
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module">
    import { auth, db } from '../config.js';
    import { collection, query, where, orderBy, limit, getDocs, doc, addDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const IMGBB_API_KEY = '9a111fa5355e1361b7ef649258165477';

    // --- State Management ---
    const STATE = {
      view: 'categories', // 'categories' or 'products'
      activeCatId: null,
      activeCatName: null,
      searchQuery: '',
      modalStack: [],
      editContext: null, // Holds item being edited
      tempBase64Img: null, // Temporary un-uploaded compressed image
      pendingImgTarget: null // 'cat' or 'prod'
    };

    // --- DOM Elements ---
    const ui = {
      title: document.getElementById('main-title'),
      btnBack: document.getElementById('btn-back-to-cats'),
      searchInput: document.getElementById('search-input'),
      feed: document.getElementById('feed-container'),
      fab: document.getElementById('main-fab'),
      overlay: document.getElementById('main-overlay'),
      sheets: {
        cat: document.getElementById('sheet-category'),
        prod: document.getElementById('sheet-product'),
        source: document.getElementById('sheet-source')
      },
      fs: {
        camera: document.getElementById('modal-camera'),
        detail: document.getElementById('modal-product-detail'),
        zoom: document.getElementById('viewer-zoom')
      }
    };

    // --- 1. Routing & Hardware Back Button Engine ---
    function openModal(modalId) {
      if (navigator.vibrate) navigator.vibrate(10);
      
      const el = document.getElementById(modalId);
      if(!el) return;

      // If it's a bottom sheet, show overlay
      if(el.classList.contains('bottom-sheet')) {
        ui.overlay.classList.add('active');
      }
      
      el.classList.add('active');
      STATE.modalStack.push(modalId);
      history.pushState({ modal: modalId }, '');
    }

    function closeModalUI(modalId) {
      const el = document.getElementById(modalId);
      if(el) el.classList.remove('active');
      
      // If no bottom sheets remain in stack, hide overlay
      const hasSheets = STATE.modalStack.some(id => document.getElementById(id)?.classList.contains('bottom-sheet'));
      if(!hasSheets) ui.overlay.classList.remove('active');
      
      // Special teardowns
      if(modalId === 'modal-camera') stopCamera();
    }

    window.addEventListener('popstate', (e) => {
      if (STATE.modalStack.length > 0) {
        // Close top modal
        const top = STATE.modalStack.pop();
        closeModalUI(top);
      } else if (STATE.view === 'products') {
        // Back from products to categories
        switchView('categories');
      }
    });

    // Bind all close buttons
    document.querySelectorAll('.btn-close-modal').forEach(btn => {
      btn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(10);
        if (STATE.modalStack.length > 0) history.back();
      });
    });

    ui.overlay.addEventListener('click', () => {
      if (STATE.modalStack.length > 0) history.back();
    });

    // --- 2. Dual-State View Engine ---
    function switchView(targetView, catId = null, catName = null) {
      STATE.view = targetView;
      STATE.searchQuery = '';
      ui.searchInput.value = '';

      if (targetView === 'categories') {
        STATE.activeCatId = null;
        STATE.activeCatName = null;
        ui.btnBack.style.display = 'none';
        ui.title.innerText = 'Catalogs';
        ui.searchInput.placeholder = 'Search catalogs...';
        loadCategories();
      } else {
        STATE.activeCatId = catId;
        STATE.activeCatName = catName;
        ui.btnBack.style.display = 'flex';
        ui.title.innerText = catName;
        ui.searchInput.placeholder = `Search in ${catName}...`;
        
        // Push state so HW back button returns to categories
        history.pushState({ view: 'products', catId }, '');
        loadProducts();
      }
    }

    ui.btnBack.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(10);
      history.back(); // Triggers popstate which handles the switch
    });

    // --- 3. Keyword Generator ---
    function generateKeywordMap(str1, str2 = '', str3 = '') {
      const map = {};
      const combined = `${str1} ${str2} ${str3}`.toLowerCase().replace(/[^a-z0-9 ]/g, '');
      const words = combined.split(' ').filter(w => w.trim().length > 0);
      
      words.forEach(word => {
        let prefix = '';
        for (let i = 0; i < word.length; i++) {
          prefix += word[i];
          map[prefix] = true;
        }
      });
      return map;
    }

    // --- 4. Firestore Fetching (Categories) ---
    async function loadCategories() {
      ui.feed.className = 'feed-container grid-layout';
      ui.feed.innerHTML = Array(6).fill(`<div class="cat-card" style="pointer-events:none;"><div class="skeleton cat-img-wrap"></div><div class="cat-details"><div class="skeleton" style="height:16px; width:80%;"></div></div></div>`).join('');
      
      try {
        let q;
        if (STATE.searchQuery) {
          q = query(collection(db, "categories"), where(`searchKeywords.${STATE.searchQuery}`, "==", true), limit(20));
        } else {
          q = query(collection(db, "categories"), orderBy("name"), limit(20));
        }
        
        const snap = await getDocs(q);
        ui.feed.innerHTML = '';
        
        if (snap.empty) {
          ui.feed.className = 'feed-container';
          ui.feed.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-sub);">No catalogs found.</div>`;
          return;
        }

        snap.forEach(docSnap => {
          const cat = { id: docSnap.id, ...docSnap.data() };
          
          const card = document.createElement('div');
          card.className = 'cat-card';
          card.innerHTML = `
            <div class="cat-img-wrap">
              ${cat.imageUrl ? `<img src="${cat.imageUrl}" class="cat-img">` : `<div class="cat-img" style="display:flex;align-items:center;justify-content:center;background:var(--skeleton-base);color:var(--text-sub);">No Image</div>`}
              <button class="btn-edit-cat" data-id="${cat.id}"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.89 1.127l-3.196.1a.375.375 0 01-.423-.423l.1-3.196a4.5 4.5 0 011.127-1.89l14.312-14.31z"/></svg></button>
            </div>
            <div class="cat-details">
              <div class="cat-name">${cat.name}</div>
              ${cat.description ? `<div class="cat-meta">${cat.description}</div>` : ''}
            </div>
          `;
          
          // Edit Cat Event
          card.querySelector('.btn-edit-cat').addEventListener('click', (e) => {
            e.stopPropagation();
            openCategoryForm(cat);
          });

          // Open Cat Event
          card.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(10);
            switchView('products', cat.id, cat.name);
          });
          
          ui.feed.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        ui.feed.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Error loading data.</div>`;
      }
    }

    // --- 5. Firestore Fetching (Products) ---
    async function loadProducts() {
      ui.feed.className = 'feed-container'; // List layout
      ui.feed.innerHTML = Array(5).fill(`<div class="prod-card" style="pointer-events:none;"><div class="skeleton prod-img"></div><div class="prod-info"><div class="skeleton" style="height:16px; width:70%;"></div><div class="skeleton" style="height:12px; width:40%;"></div></div></div>`).join('');
      
      try {
        let q;
        if (STATE.searchQuery) {
          q = query(collection(db, "products"), where("categoryId", "==", STATE.activeCatId), where(`searchKeywords.${STATE.searchQuery}`, "==", true), limit(20));
        } else {
          q = query(collection(db, "products"), where("categoryId", "==", STATE.activeCatId), orderBy("name"), limit(20));
        }
        
        const snap = await getDocs(q);
        ui.feed.innerHTML = '';
        
        if (snap.empty) {
          ui.feed.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-sub);">No products in this catalog yet.</div>`;
          return;
        }

        snap.forEach(docSnap => {
          const prod = { id: docSnap.id, ...docSnap.data() };
          
          const card = document.createElement('div');
          card.className = 'prod-card';
          card.innerHTML = `
            <img class="prod-img" src="${prod.imageUrl || ''}" onerror="this.style.display='none'">
            <div class="prod-info">
              <div class="prod-name">${prod.name}</div>
              ${prod.code ? `<div class="prod-code">${prod.code}</div>` : ''}
            </div>
          `;
          
          card.addEventListener('click', () => {
            if (navigator.vibrate) navigator.vibrate(10);
            openProductDetail(prod);
          });
          
          ui.feed.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        ui.feed.innerHTML = `<div style="text-align:center; padding:40px; color:var(--danger);">Error loading data.</div>`;
      }
    }

    // --- Search Engine ---
    let searchDebounce;
    ui.searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      STATE.searchQuery = e.target.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      
      searchDebounce = setTimeout(() => {
        if (STATE.view === 'categories') loadCategories();
        else loadProducts();
      }, 400);
    });

    // --- 6. Form Management ---
    ui.fab.addEventListener('click', () => {
      if (STATE.view === 'categories') openCategoryForm(null);
      else openProductForm(null);
    });

    function openCategoryForm(catData) {
      STATE.editContext = catData;
      STATE.tempBase64Img = null;
      STATE.pendingImgTarget = 'cat';
      
      document.getElementById('sheet-cat-title').innerText = catData ? 'Edit Catalog' : 'Add Catalog';
      document.getElementById('cat-name').value = catData ? catData.name : '';
      document.getElementById('cat-desc').value = catData ? (catData.description || '') : '';
      
      const imgPreview = document.getElementById('cat-img-preview');
      const box = document.getElementById('cat-img-picker');
      if (catData && catData.imageUrl) {
        imgPreview.src = catData.imageUrl;
        box.classList.add('has-image');
      } else {
        imgPreview.src = '';
        box.classList.remove('has-image');
      }
      
      openModal('sheet-category');
    }

    function openProductForm(prodData) {
      STATE.editContext = prodData;
      STATE.tempBase64Img = null;
      STATE.pendingImgTarget = 'prod';
      
      document.getElementById('sheet-prod-title').innerText = prodData ? 'Edit Product' : 'Add Product';
      document.getElementById('prod-name').value = prodData ? prodData.name : '';
      document.getElementById('prod-code').value = prodData ? (prodData.code || '') : '';
      document.getElementById('prod-desc').value = prodData ? (prodData.description || '') : '';
      
      const imgPreview = document.getElementById('prod-img-preview');
      const box = document.getElementById('prod-img-picker');
      if (prodData && prodData.imageUrl) {
        imgPreview.src = prodData.imageUrl;
        box.classList.add('has-image');
      } else {
        imgPreview.src = '';
        box.classList.remove('has-image');
      }
      
      openModal('sheet-product');
    }

    // --- 7. Native Camera & Canvas Compression Engine ---
    document.getElementById('cat-img-picker').addEventListener('click', () => openModal('sheet-source'));
    document.getElementById('prod-img-picker').addEventListener('click', () => openModal('sheet-source'));

    document.getElementById('btn-open-gallery').addEventListener('click', () => {
      document.getElementById('hidden-file').click();
      history.back(); // Close source picker sheet
    });

    document.getElementById('hidden-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      processAndCompressFile(file);
    });

    // In-App Camera Variables
    let videoStream = null;
    const videoEl = document.getElementById('camera-video');

    document.getElementById('btn-open-camera').addEventListener('click', async () => {
      history.back(); // close source sheet
      setTimeout(startCamera, 300); // Wait for transition
    });

    async function startCamera() {
      document.getElementById('cam-fallback').style.display = 'none';
      openModal('modal-camera');
      
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment', width: { ideal: 1280 } }, 
          audio: false 
        });
        videoEl.srcObject = videoStream;
      } catch (err) {
        console.error("Camera Error:", err);
        document.getElementById('cam-fallback').style.display = 'flex';
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    document.getElementById('btn-capture-photo').addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(20);
      if (!videoStream) return;

      // Draw video frame to canvas
      const canvas = document.createElement('canvas');
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      
      // Compress
      const base64Img = canvas.toDataURL('image/jpeg', 0.8);
      
      // Save temp and update UI
      applyCompressedImage(base64Img);
      
      history.back(); // Close camera modal
    });

    function processAndCompressFile(file) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          const base64Img = canvas.toDataURL('image/jpeg', 0.8);
          applyCompressedImage(base64Img);
        };
      };
    }

    function applyCompressedImage(base64Img) {
      STATE.tempBase64Img = base64Img;
      
      if (STATE.pendingImgTarget === 'cat') {
        const img = document.getElementById('cat-img-preview');
        img.src = base64Img;
        document.getElementById('cat-img-picker').classList.add('has-image');
      } else {
        const img = document.getElementById('prod-img-preview');
        img.src = base64Img;
        document.getElementById('prod-img-picker').classList.add('has-image');
      }
    }

    async function uploadToImgBB(base64Data) {
      const cleanBase64 = base64Data.split(',')[1];
      const formData = new FormData();
      formData.append('image', cleanBase64);
      
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
      const data = await res.json();
      if (!data.success) throw new Error("Upload Failed");
      return data.data.url;
    }

    // --- 8. Save Logic (Firestore) ---
    document.getElementById('btn-save-cat').addEventListener('click', async (e) => {
      const name = document.getElementById('cat-name').value.trim();
      const desc = document.getElementById('cat-desc').value.trim();
      if (!name) return alert("Catalog name required.");
      
      const btn = e.target;
      btn.innerText = 'Saving...'; btn.style.pointerEvents = 'none';

      try {
        let finalImageUrl = STATE.editContext ? STATE.editContext.imageUrl : null;
        if (STATE.tempBase64Img) {
          finalImageUrl = await uploadToImgBB(STATE.tempBase64Img);
        }

        const payload = {
          name,
          description: desc,
          imageUrl: finalImageUrl,
          searchKeywords: generateKeywordMap(name, desc),
          updatedAt: new Date().toISOString()
        };

        if (STATE.editContext) {
          await updateDoc(doc(db, "categories", STATE.editContext.id), payload);
        } else {
          payload.createdAt = new Date().toISOString();
          await addDoc(collection(db, "categories"), payload);
        }

        history.back(); // Close sheet
        loadCategories();
      } catch (err) {
        console.error(err);
        alert("Failed to save catalog.");
      }
      btn.innerText = 'Save Catalog'; btn.style.pointerEvents = 'auto';
    });

    document.getElementById('btn-save-prod').addEventListener('click', async (e) => {
      const name = document.getElementById('prod-name').value.trim();
      const code = document.getElementById('prod-code').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      if (!name) return alert("Product name required.");
      
      const btn = e.target;
      btn.innerText = 'Saving...'; btn.style.pointerEvents = 'none';

      try {
        let finalImageUrl = STATE.editContext ? STATE.editContext.imageUrl : null;
        if (STATE.tempBase64Img) {
          finalImageUrl = await uploadToImgBB(STATE.tempBase64Img);
        }

        const payload = {
          categoryId: STATE.activeCatId,
          name,
          code,
          description: desc,
          imageUrl: finalImageUrl,
          searchKeywords: generateKeywordMap(name, code, desc),
          updatedAt: new Date().toISOString()
        };

        if (STATE.editContext) {
          await updateDoc(doc(db, "products", STATE.editContext.id), payload);
        } else {
          payload.createdAt = new Date().toISOString();
          await addDoc(collection(db, "products"), payload);
        }

        history.back(); // Close sheet
        
        // If we were editing from detail view, close that too
        if (STATE.modalStack.includes('modal-product-detail')) {
           history.back();
        }
        
        loadProducts();
      } catch (err) {
        console.error(err);
        alert("Failed to save product.");
      }
      btn.innerText = 'Save Product'; btn.style.pointerEvents = 'auto';
    });

    // --- 9. Product Detail & Zoom View ---
    let currentDetailProd = null;

    function openProductDetail(prod) {
      currentDetailProd = prod;
      document.getElementById('pd-name').innerText = prod.name;
      document.getElementById('pd-code').innerText = prod.code || '';
      document.getElementById('pd-code').style.display = prod.code ? 'block' : 'none';
      document.getElementById('pd-desc').innerText = prod.description || '';
      
      const imgEl = document.getElementById('pd-img');
      if (prod.imageUrl) {
        imgEl.src = prod.imageUrl;
        imgEl.style.display = 'block';
      } else {
        imgEl.style.display = 'none';
      }

      openModal('modal-product-detail');
    }

    document.getElementById('pd-img-wrap').addEventListener('click', () => {
      if (!currentDetailProd || !currentDetailProd.imageUrl) return;
      document.getElementById('zoom-img').src = currentDetailProd.imageUrl;
      openModal('viewer-zoom');
    });

    document.getElementById('pd-btn-edit').addEventListener('click', () => {
      openProductForm(currentDetailProd);
    });

    document.getElementById('pd-btn-delete').addEventListener('click', async () => {
      if (!confirm("Delete this product permanently?")) return;
      
      try {
        await deleteDoc(doc(db, "products", currentDetailProd.id));
        history.back(); // Close detail view
        loadProducts();
      } catch (err) {
        alert("Failed to delete product.");
      }
    });

    // Initialize
    onAuthStateChanged(auth, (user) => {
      if (user) switchView('categories');
    });

  </script>
</body>
</html>
